[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analyzer-pro"
version = "1.0.0"
description = "Multi-level sentiment analysis: lexicon scoring, aspect extraction, and emotion detection"
authors = [{name = "Daniel Schmidt", email = "danschmidt88@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []  # stdlib only; numpy is optional

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
sentiment-pro = "sentiment_analyzer_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
